name: Cypress Tests

on:
  push:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: saucedemo-test/03-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'saucedemo-test/03-automation/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test -- --headless --browser chrome